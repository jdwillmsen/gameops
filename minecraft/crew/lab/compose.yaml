# The crew lab: a throwaway Bedrock world where crew and cameras may use
# cheats. Never point anything here at FWB, and never point crew at FWB.
name: crew-lab

services:
  lab:
    # Same tag and VERSION policy as FWB, so a protocol bump that breaks crew
    # here is the one that would break it there.
    image: itzg/minecraft-bedrock-server:2026.10.2
    environment:
      EULA: "TRUE"
      VERSION: "LATEST"
      SERVER_NAME: "crew-lab"
      LEVEL_NAME: "crew-lab"
      GAMEMODE: "survival"
      DIFFICULTY: "normal"
      ALLOW_CHEATS: "true"
      # Offline, so crew joins with only a display name. This is why the lab
      # can never be FWB: an online-mode server rejects such a client.
      ONLINE_MODE: "false"
      ALLOW_LIST: "false"
      # Bedrock 1.26.51 defaults a fresh world to NetherNet, which opens no
      # RakNet listener, and crew dials RakNet only. FWB runs RakNet for the
      # same reason, and retail clients still join it, despite the server's
      # startup error claiming NetherNet is the only supported transport.
      TRANSPORT: "raknet"
      # Not set by default. A single lab run joined cleanly at 6, where about
      # half the joins at the image's default of 32 ended in a first-join
      # burst past the client's 16 MiB batch limit. Enable it for a mender or
      # builder trial, where a unit that drops that way wastes the run.
      # VIEW_DISTANCE: "6"
      # Ops are granted from the console with `send-command op <gamertag>`,
      # so no gamertag needs to be committed here.
    # Loopback only: with online mode and the allow list off, anyone who can
    # reach this port joins under any name they choose.
    ports:
      - "127.0.0.1:19132:19132/udp"
    volumes:
      - lab-world:/data
    stdin_open: true
    tty: true

  crew-01:
    build:
      context: ../../..
      dockerfile: minecraft/crew/Dockerfile
    depends_on: [lab]
    environment:
      MC_HOST: lab
      MC_PORT: "19132"
      # The lab is offline, so crew joins by display name alone.
      MC_OFFLINE: "true"
      CREW_ID: crew-01
      MC_USERNAME: Agate
      CAMERA_ENABLED: "true"
      # Bound wide only inside the compose network; the published port below
      # is loopback-only on the host.
      STATUS_ADDR: 0.0.0.0:8080
      # Unset leaves the task endpoints off. Export it in the shell that runs
      # compose; it is never written to a file here.
      TASKS_TOKEN: ${TASKS_TOKEN:-}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - crew-01-data:/data

  crew-02:
    build:
      context: ../../..
      dockerfile: minecraft/crew/Dockerfile
    depends_on: [lab]
    environment:
      MC_HOST: lab
      MC_PORT: "19132"
      # The lab is offline, so crew joins by display name alone.
      MC_OFFLINE: "true"
      CREW_ID: crew-02
      MC_USERNAME: Basalt
      CAMERA_ENABLED: "true"
      # Bound wide only inside the compose network; the published port below
      # is loopback-only on the host.
      STATUS_ADDR: 0.0.0.0:8080
      # Unset leaves the task endpoints off. Export it in the shell that runs
      # compose; it is never written to a file here.
      TASKS_TOKEN: ${TASKS_TOKEN:-}
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - crew-02-data:/data

  crew-03:
    build:
      context: ../../..
      dockerfile: minecraft/crew/Dockerfile
    depends_on: [lab]
    environment:
      MC_HOST: lab
      MC_PORT: "19132"
      # The lab is offline, so crew joins by display name alone.
      MC_OFFLINE: "true"
      CREW_ID: crew-03
      MC_USERNAME: Cobble
      CAMERA_ENABLED: "true"
      # Bound wide only inside the compose network; the published port below
      # is loopback-only on the host.
      STATUS_ADDR: 0.0.0.0:8080
      # Unset leaves the task endpoints off. Export it in the shell that runs
      # compose; it is never written to a file here.
      TASKS_TOKEN: ${TASKS_TOKEN:-}
    ports:
      - "127.0.0.1:8083:8080"
    volumes:
      - crew-03-data:/data

  # A mender or builder unit, off by default. It needs CREW_LAB=true or it
  # refuses to start, and the lab console must put it in creative after every
  # join: lab/creative.sh lab Dusty. To enable, uncomment this service, its
  # volume below, and export TASKS_TOKEN as for the others.
  #
  # crew-04:
  #   build:
  #     context: ../../..
  #     dockerfile: minecraft/crew/Dockerfile
  #   depends_on: [lab]
  #   environment:
  #     MC_HOST: lab
  #     MC_PORT: "19132"
  #     MC_OFFLINE: "true"
  #     CREW_ID: crew-04
  #     MC_USERNAME: Dusty
  #     CREW_ROLE: mender
  #     CREW_LAB: "true"
  #     STATUS_ADDR: 0.0.0.0:8080
  #     TASKS_TOKEN: ${TASKS_TOKEN:-}
  #   ports:
  #     - "127.0.0.1:8084:8080"
  #   volumes:
  #     - crew-04-data:/data

volumes:
  lab-world:
  crew-01-data:
  crew-02-data:
  crew-03-data:
  # crew-04-data:
