# One-wave book for the stage-0 add-on pack mob gameops:training_dummy_brute.
# Run it only on a lab with packs/lab-mods-stage0 loaded:
#   arena.sh run <lab> --waves lab/waves-custom-brute.yaml
# A pack mob has no equipment slots, so each tier is effects only.
pause: 8s
max_live: 12
wave_timeout: 3m

tiers:
  1:
    effects:
      - {id: strength, seconds: 600, amplifier: 0}
  2:
    effects:
      - {id: strength, seconds: 600, amplifier: 0}
      - {id: resistance, seconds: 600, amplifier: 1}
  3:
    effects:
      - {id: resistance, seconds: 600, amplifier: 1}
      - {id: health_boost, seconds: 600, amplifier: 4}
  4:
    effects:
      - {id: health_boost, seconds: 600, amplifier: 7}
      - {id: resistance, seconds: 600, amplifier: 3}
      - {id: strength, seconds: 600, amplifier: 1}
  5:
    effects:
      - {id: health_boost, seconds: 600, amplifier: 9}
      - {id: resistance, seconds: 600, amplifier: 2}
      - {id: strength, seconds: 600, amplifier: 2}

waves:
  - name: Brute Drill
    mobs:
      - {mob: "gameops:training_dummy_brute", count: 4, tier: 1, pen: 1}
      - {mob: "gameops:training_dummy_brute", count: 2, tier: 2, name: Sergeant, pen: 2}
