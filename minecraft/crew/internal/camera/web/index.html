<!doctype html>
<meta charset="utf-8">
<title>crew camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px monospace; }
  canvas { display: block; }
  #debug { position: fixed; left: 8px; top: 8px; color: #fff; background: #0008; padding: 4px 8px; white-space: pre; }
  #debug.off { display: none; }

  /* Operator overlay: plain DOM over the canvas, fed by v1/state. */
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 12px/1.3 monospace; text-shadow: 1px 1px 0 #000; }
  #ui .panel { position: absolute; background: #000a; border: 1px solid #fff3; padding: 6px 8px; }
  #ui h2 { margin: 0 0 4px; font-size: 11px; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; color: #bbb; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; mix-blend-mode: difference; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #bottom { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #hearts { display: flex; gap: 1px; height: 18px; }
  .heart { width: 18px; height: 18px; image-rendering: pixelated; background-size: 100% 100%; }
  .row { display: flex; gap: 2px; }
  .slot { position: relative; width: 36px; height: 36px; box-sizing: border-box; background: #0009; border: 2px solid #555; }
  .slot.sel { border-color: #fff; box-shadow: 0 0 0 2px #000; }
  .icon { position: absolute; inset: 2px; image-rendering: pixelated; background-repeat: no-repeat; font-size: 9px; overflow: hidden; word-break: break-all; }
  .count { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: bold; }
  #inv { right: 8px; top: 8px; }
  #inv .gap { height: 8px; }
  #status { right: 8px; bottom: 8px; min-width: 200px; }
  #status .dead { color: #f66; font-weight: bold; }
  #status .live { color: #7f7; }
  #status .bad { color: #fb5; }
  #tasks { left: 8px; bottom: 28px; width: 280px; }
  #tasks .cur { margin-bottom: 6px; }
  .bar { height: 8px; background: #333; border: 1px solid #888; margin: 3px 0; }
  .bar > div { height: 100%; background: #5c5; }
  .bar.pending > div { width: 30%; background: #aa5; }
  .t { display: flex; gap: 6px; }
  .t .st { width: 62px; flex: none; }
  .st.done { color: #7f7; } .st.failed { color: #f66; } .st.running { color: #8cf; } .st.queued { color: #bbb; } .st.cancelled { color: #fb5; }
  .reason { color: #f99; margin-left: 68px; }
  #hint { position: absolute; left: 8px; bottom: 8px; color: #ccc; font-size: 10px; }
  html.nohud #ui, html.nohud #debug { display: none; }
  #mini { position: fixed; left: 6px; bottom: 6px; color: #ddd; font-size: 10px; text-shadow: 1px 1px 0 #000; display: none; }
  html.nohud #mini.show { display: block; }
  #ui.stale .panel, #ui.stale #bottom { opacity: .5; }
</style>
<div id="debug">connecting...</div>
<div id="mini"></div>
<div id="ui">
  <div id="cross"></div>
  <div id="inv" class="panel"><h2>inventory</h2><div id="invgrid"></div></div>
  <div id="tasks" class="panel"><h2>tasks</h2><div id="tasklist">no state yet</div></div>
  <div id="status" class="panel"><h2>status</h2><div id="statuslist"></div></div>
  <div id="bottom"><div id="hearts"></div><div id="hotbar" class="row"></div></div>
  <div id="hint">F3: debug info</div>
</div>
<script>
// Operator overlay. A classic script, apart from the three.js module, so the
// readouts survive a failed CDN load. Server strings only ever reach the page
// through textContent.
(() => {
  const $ = id => document.getElementById(id);
  const ui = $('ui');
  // hud=0 is the bare tile a console frames: no overlay and no state poll.
  if (new URLSearchParams(location.search).get('hud') === '0') { document.documentElement.classList.add('nohud'); return; }
  const DIMENSIONS = { 0: 'overworld', 1: 'nether', 2: 'the end' };
  let sheet = null; // { doc, url }
  let last = null, failed = false;

  addEventListener('keydown', e => {
    if (e.key !== 'F3') return;
    e.preventDefault();
    $('debug').classList.toggle('off');
  });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // Pixel hearts as data URIs, drawn once.
  const HEART = ['.XX..XX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'];
  function heartURL(fill) {
    let r = '';
    HEART.forEach((row, y) => [...row].forEach((c, x) => {
      if (c !== 'X') return;
      const edge = y === 0 || y === HEART.length - 1 || x === 0 || x === 7 || HEART[y][x - 1] === '.' || HEART[y][x + 1] === '.' || HEART[y - 1]?.[x] === '.' || HEART[y + 1]?.[x] === '.';
      const lit = fill === 'full' || (fill === 'half' && x < 4);
      const colour = edge ? '#2b0000' : lit ? (y < 2 && x % 4 === 1 ? '#ff9a9a' : '#e02020') : '#3a3a3a';
      r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colour}"/>`;
    }));
    return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 7" shape-rendering="crispEdges">${r}</svg>`)}")`;
  }
  const HEARTS = { full: heartURL('full'), half: heartURL('half'), empty: heartURL('empty') };

  function drawHearts(s) {
    const box = $('hearts');
    if (!s.health_known) { box.replaceChildren(); return; }
    const halves = Math.max(0, Math.min(20, Math.round(s.health)));
    const kids = [];
    for (let i = 0; i < 10; i++) {
      const h = el('div', 'heart');
      h.style.backgroundImage = HEARTS[halves >= 2 * i + 2 ? 'full' : halves === 2 * i + 1 ? 'half' : 'empty'];
      kids.push(h);
    }
    box.title = `${s.health} health`;
    box.replaceChildren(...kids);
  }

  // Item names arrive without the namespace.
  function icon(name) {
    const d = el('div', 'icon');
    if (!sheet) { d.textContent = name.slice(0, 6); return d; }
    const r = sheet.doc.items['minecraft:' + name] ?? sheet.doc.placeholder;
    const w = r[2] - r[0], h = r[3] - r[1], px = 28;
    d.style.backgroundImage = `url(${sheet.url})`;
    d.style.backgroundSize = `${px / w}px ${px / h}px`;
    d.style.backgroundPosition = `${-r[0] / w * px}px ${-r[1] / h * px}px`;
    return d;
  }

  function slotEl(item, selected) {
    const d = el('div', 'slot' + (selected ? ' sel' : ''));
    if (item) {
      d.title = item.name.replace(/_/g, ' ');
      d.append(icon(item.name));
      if (item.count > 1) d.append(el('span', 'count', String(item.count)));
    }
    return d;
  }

  function drawInventory(s) {
    const bySlot = new Map((s.inventory ?? []).map(i => [i.slot, i]));
    const row = (from) => { const r = el('div', 'row'); for (let i = from; i < from + 9; i++) r.append(slotEl(bySlot.get(i), false)); return r; };
    const grid = [];
    for (let r = 1; r < 4; r++) grid.push(row(r * 9));
    grid.push(el('div', 'gap'), row(0));
    $('invgrid').replaceChildren(...grid);

    const hot = [];
    for (let i = 0; i < 9; i++) hot.push(slotEl(bySlot.get(i), s.held_known && s.held_slot === i));
    $('hotbar').replaceChildren(...hot);
  }

  function field(label, value, cls) {
    const d = el('div');
    d.append(el('span', '', label + ' '), el('span', cls || '', value));
    return d;
  }

  function drawStatus(s) {
    const cam = window.__camStatus ?? 'page script not running';
    const rows = [field('camera', cam, cam === 'live' ? 'live' : 'bad')];
    if (failed) rows.push(field('crew', 'status unreachable', 'bad'));
    else if (!s.spawned) rows.push(field('crew', 'not in the world', 'bad'));
    else rows.push(s.dead ? field('crew', 'dead', 'dead') : field('crew', 'alive', 'live'));
    if (s.spawned) {
      rows.push(field('dimension', DIMENSIONS[s.dimension] ?? `unknown (${s.dimension})`));
      rows.push(field('position', s.position_known ? s.position.map(v => Math.round(v)).join(', ') : 'unknown'));
    }
    $('statuslist').replaceChildren(...rows);
  }

  function taskLine(t) {
    const d = el('div');
    const line = el('div', 't');
    line.append(el('span', 'st ' + t.state, t.state), el('span', '', `${t.template}${t.item ? ' ' + t.item.replace(/^minecraft:/, '') : ''}`));
    d.append(line);
    if (t.reason) d.append(el('div', 'reason', t.reason));
    return d;
  }

  function drawTasks(tasks) {
    const out = [];
    const cur = tasks?.current;
    if (cur) {
      const c = el('div', 'cur');
      c.append(el('div', '', `${cur.template}${cur.item ? ': ' + cur.item.replace(/^minecraft:/, '') : ''}`));
      c.append(el('div', '', `skill ${cur.skill || '-'}  state ${cur.state}`));
      const bar = el('div', cur.qty > 0 ? 'bar' : 'bar pending'), fill = el('div');
      if (cur.qty > 0) fill.style.width = Math.min(100, cur.progress / cur.qty * 100) + '%';
      bar.append(fill);
      c.append(bar, el('div', '', cur.qty > 0 ? `${cur.progress} / ${cur.qty}` : `progress ${cur.progress}`));
      out.push(c);
    } else {
      out.push(el('div', 'cur', 'idle'));
    }
    const recent = tasks?.recent ?? [];
    if (recent.length) out.push(el('h2', '', 'recent'), ...recent.map(taskLine));
    $('tasklist').replaceChildren(...out);
  }

  function render() {
    const s = last?.state ?? { spawned: false, inventory: [] };
    ui.classList.toggle('stale', failed);
    drawHearts(s);
    drawInventory(s);
    drawStatus(s);
    drawTasks(last?.tasks);
  }

  // 404 until the server has built the sheet; retried on every poll.
  async function loadSheet() {
    if (sheet) return;
    try {
      const doc = await fetch('v1/camera/items.json').then(r => { if (!r.ok) throw 0; return r.json(); });
      const url = 'v1/camera/items.png';
      await new Promise((ok, no) => { const i = new Image(); i.onload = ok; i.onerror = no; i.src = url; });
      sheet = { doc, url };
    } catch { /* icons stay as text until it exists */ }
  }

  async function poll() {
    try {
      const r = await fetch('v1/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      last = await r.json();
      failed = false;
    } catch { failed = true; }
    if (!sheet) await loadSheet();
    render();
  }
  render();
  poll();
  setInterval(poll, 1000);
})();
</script>

<script type="module">
// Per-sub-chunk geometry with only the faces next to a non-opaque neighbour,
// the same technique prismarine-viewer's mesher uses; no code is copied.
import * as THREE from 'three';
import { createEntities } from './v1/camera/entities.js';

const t0 = performance.now();
const stats = window.__stats = { firstFrameMs: null, frames: 0, bytes: 0, wsOpenMs: null, settledMs: null, lastBlockAt: 0, workMs: 0, workMaxMs: 0, drawn: 0, total: 0, drawnSum: 0, totalSum: 0 };
const hud = document.getElementById('debug');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
// Daytime sky: the fog fades distant terrain into the horizon colour, so the
// edge of the loaded area melts into the sky instead of showing a hard cut.
const SKY_HORIZON = new THREE.Color(0xc0d8ff), SKY_ZENITH = new THREE.Color(0x78a7ff);
renderer.setClearColor(SKY_HORIZON);
scene.fog = new THREE.Fog(SKY_HORIZON, 40, 64);
// Shared by every block material and kept in step with scene.fog, which the
// entity materials read.
const fogUniforms = { uFogColor: { value: SKY_HORIZON }, uFogNear: { value: 40 }, uFogFar: { value: 64 } };
let fogFar = 64;
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.05, 100);
// Terrain is only loaded out to the requested radius, so the fog closes
// just there.
function setFog(chunks) {
  fogFar = Math.max(48, chunks * 16);
  fogUniforms.uFogFar.value = scene.fog.far = fogFar;
  fogUniforms.uFogNear.value = scene.fog.near = fogFar * .55;
  camera.far = fogFar + 32;
  camera.updateProjectionMatrix();
}

const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.ShaderMaterial({
  uniforms: { uHorizon: { value: SKY_HORIZON }, uZenith: { value: SKY_ZENITH } },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = (projectionMatrix * modelViewMatrix * vec4(position, 1.)).xyww;
    }`,
  fragmentShader: `
    uniform vec3 uHorizon, uZenith;
    varying vec3 vDir;
    void main() {
      float h = normalize(vDir).y;
      gl_FragColor = vec4(mix(uHorizon, uZenith, pow(clamp(h, 0., 1.), .6)), 1.);
      #include <colorspace_fragment>
    }`,
  side: THREE.BackSide, depthTest: false, depthWrite: false, fog: false,
}));
skyDome.frustumCulled = false;
skyDome.renderOrder = -1;
scene.add(skyDome);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

let mats = [];            // index = id
const blocks = new Map(); // "cx,cy,cz" -> Uint8Array(4096)
const meshes = new Map(); // key -> [opaque, translucent]
const me = { x: 0, y: 70, z: 0, yaw: 0, pitch: 0 };
window.__dbg = { get entMeshes() { return ents.meshes; }, scene, camera, me, blocks, meshes, get mats() { return mats; }, atlasReady: () => !!atlas };

// Meshing runs in a worker (mesher.js); the page keeps the cells only to
// apply block edits and report its size.
const worker = new Worker('v1/camera/mesher.js');
let sent = 0, acked = 0, queued = 0, epoch = 0;
const ready = []; // finished meshes waiting for the next frame to adopt them
worker.onmessage = ev => {
  const m = ev.data;
  if (m.epoch !== epoch) return; // from before a reset
  if (m.t === 'mesh') ready.push(m);
  else { acked = m.seq; queued = m.queued; }
};
const post = (m, transfer) => worker.postMessage({ ...m, seq: ++sent }, transfer || []);
const meshing = () => ready.length > 0 || queued > 0 || acked !== sent;

// Same colour-space conversion the old in-page mesher got from THREE.Color.
const linear = css => { const c = new THREE.Color(css); return [c.r, c.g, c.b]; };

function adopt(m) {
  const old = meshes.get(m.key);
  if (old) { for (const o of old) { scene.remove(o); o.geometry.dispose(); } meshes.delete(m.key); }
  if (!blocks.has(m.key)) return;
  const out = [];
  for (const q of m.parts) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(q.p, 3));
    geo.setAttribute('shade', new THREE.BufferAttribute(q.c, 4));
    if (q.k < 2) geo.setAttribute('tex', new THREE.BufferAttribute(q.u, 3));
    geo.setIndex(new THREE.BufferAttribute(q.i, 1));
    const o = new THREE.Mesh(geo, blockMaterial(q.k));
    // Culled by hand against the tight box the worker measured; the built-in
    // test would compute a loose bounding sphere on the main thread instead.
    o.frustumCulled = false;
    o.matrixAutoUpdate = false;
    o.userData.blended = q.k & 1;
    o.userData.box = new THREE.Box3(new THREE.Vector3(q.box[0], q.box[1], q.box[2]), new THREE.Vector3(q.box[3], q.box[4], q.box[5]));
    scene.add(o); out.push(o);
  }
  meshes.set(m.key, out);
}

const blended = [];
const frustum = new THREE.Frustum(), projView = new THREE.Matrix4();
const fwd = new THREE.Vector3(), mid = new THREE.Vector3(), half = new THREE.Vector3();
// Past the fog's far plane everything is the sky colour, so those meshes
// cost fill and vertex work for nothing. Fog grows with depth along the view
// direction, not distance: off-axis terrain past fogFar by distance can sit
// well inside it by depth and still show.
function nearestDepth(box) {
  box.getCenter(mid).sub(camera.position);
  box.getSize(half).multiplyScalar(.5);
  return mid.dot(fwd) - (Math.abs(fwd.x) * half.x + Math.abs(fwd.y) * half.y + Math.abs(fwd.z) * half.z);
}
function cull() {
  camera.updateMatrixWorld();
  projView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projView);
  camera.getWorldDirection(fwd);
  let drawn = 0, total = 0;
  blended.length = 0;
  for (const ms of meshes.values()) for (const o of ms) {
    const box = o.userData.box;
    o.visible = frustum.intersectsBox(box) && nearestDepth(box) < fogUniforms.uFogFar.value;
    total++; if (o.visible) { drawn++; if (o.userData.blended) blended.push(o); }
  }
  // Every mesh sits at the origin, so the renderer's own back-to-front sort
  // cannot tell them apart; blending needs the far ones drawn first.
  for (const o of blended) o.userData.dist = o.userData.box.distanceToPoint(camera.position);
  blended.sort((a, b) => b.userData.dist - a.userData.dist);
  blended.forEach((o, i) => { o.renderOrder = i; });
  stats.drawn = drawn; stats.total = total;
  stats.drawnSum += drawn; stats.totalSum += total;
}

let atlas = null; // { table, tints, tex }; the worker holds its own copy of the table

// One shader for every block. Shade and occlusion arrive baked into the
// vertex colour; the shader only multiplies the texel by it, alpha-tests
// cutouts, blends the translucent pass and applies the sky fog.
const BLOCK_VERT = `
  attribute vec4 shade;
  attribute vec3 tex;
  varying vec4 vShade;
  varying vec3 vTex;
  varying float vDepth;
  void main() {
    vShade = shade;
    vTex = tex;
    vec4 mv = modelViewMatrix * vec4(position, 1.);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const BLOCK_FRAG = `
  precision highp sampler2DArray;
  uniform sampler2DArray uTiles;
  uniform vec3 uFogColor;
  uniform float uFogNear, uFogFar;
  varying vec4 vShade;
  varying vec3 vTex;
  varying float vDepth;
  void main() {
    vec3 rgb = vShade.rgb;
    float a = vShade.a;
    #ifdef TEXTURED
      vec4 t = texture(uTiles, vec3(vTex.xy, floor(vTex.z + .5)));
      rgb *= t.rgb;
      a *= t.a;
      #ifdef CUTOUT
        // Mip levels average the holes away, so the threshold relaxes with
        // distance or leaves thin out to nothing.
        vec2 gx = dFdx(vTex.xy) * TILE, gy = dFdy(vTex.xy) * TILE;
        float lod = .5 * log2(max(max(dot(gx, gx), dot(gy, gy)), 1.));
        if (t.a < max(.2, .5 - .07 * lod)) discard;
        a = 1.;
      #endif
    #endif
    #ifdef BLENDED
      if (a < .02) discard;
    #endif
    rgb = mix(rgb, uFogColor, smoothstep(uFogNear, uFogFar, vDepth));
    gl_FragColor = vec4(rgb, a);
    #include <colorspace_fragment>
  }`;
function makeBlockMaterial(tex, tile, blended) {
  const defines = {};
  if (tex) { defines.TEXTURED = ''; defines.TILE = tile.toFixed(1); if (!blended) defines.CUTOUT = ''; }

    defines, uniforms: { uTiles: { value: tex }, ...fogUniforms },
    vertexShader: BLOCK_VERT, fragmentShader: BLOCK_FRAG,
    transparent: blended, depthWrite: !blended,

const flatMaterials = [null, null, makeBlockMaterial(null, 0, false), makeBlockMaterial(null, 0, true)];
let texturedMaterials = null;
function blockMaterial(k) { return k < 2 ? texturedMaterials[k] : flatMaterials[k]; }

// One array layer per distinct tile rectangle, so mipmaps never mix
// neighbouring tiles and a face can repeat its tile at any scale.
function buildTileArray(img, table) {
  const T = table.tile_size, W = table.width, H = table.height;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const px = ctx.getImageData(0, 0, W, H).data;
  const tiles = {}, rects = [];
  for (const b of Object.values(table.blocks)) for (const f of ['up', 'down', 'side', 'north', 'south', 'east', 'west']) {
    const k = b[f].uv.join(',');
    if (!(k in tiles)) { tiles[k] = rects.length; rects.push(b[f].uv); }
  }
  const gl = renderer.getContext();
  if (rects.length > gl.getParameter(gl.MAX_ARRAY_TEXTURE_LAYERS)) throw new Error(`${rects.length} tiles exceed the array texture limit`);
  const data = new Uint8Array(T * T * 4 * rects.length);
  rects.forEach((r, layer) => {
    const x0 = Math.round(r[0] * W), y0 = Math.round(r[1] * H), out = layer * T * T * 4;
    for (let y = 0; y < T; y++) data.set(px.subarray(((y0 + y) * W + x0) * 4, ((y0 + y) * W + x0 + T) * 4), out + y * T * 4);
    // The browser hands back transparent texels as black. Mipmaps average
    // them into their neighbours, so give them the tile's own colour first or
    // cutouts grow dark fringes with distance.
    let sr = 0, sg = 0, sb = 0, sa = 0;
    for (let i = out; i < out + T * T * 4; i += 4) { const a = data[i + 3]; sr += data[i] * a; sg += data[i + 1] * a; sb += data[i + 2] * a; sa += a; }
    if (sa === 0) return;
    const fr = Math.round(sr / sa), fg = Math.round(sg / sa), fb = Math.round(sb / sa);
    for (let i = out; i < out + T * T * 4; i += 4) if (data[i + 3] === 0) { data[i] = fr; data[i + 1] = fg; data[i + 2] = fb; }
  });
  const tex = new THREE.DataArrayTexture(data, T, T, rects.length);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  tex.needsUpdate = true;
  return { tex, tiles };
}

async function loadAtlas() {
  if (atlas) return;
  try {
    const [doc, img] = await Promise.all([
      fetch('v1/camera/atlas.json').then(r => { if (!r.ok) throw new Error('atlas.json ' + r.status); return r.json(); }),
      new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('atlas.png')); i.src = 'v1/camera/atlas.png'; }),
    ]);
    const { tex, tiles } = buildTileArray(img, doc.table);
    const tints = {}, workerTints = {};
    for (const [k, v] of Object.entries(doc.tints)) { tints[k] = new THREE.Color(v); workerTints[k] = [tints[k].r, tints[k].g, tints[k].b]; }
    texturedMaterials = [makeBlockMaterial(tex, doc.table.tile_size, false), makeBlockMaterial(tex, doc.table.tile_size, true)];
    atlas = { table: doc.table, tints, tex };
    post({ t: 'atlas', atlas: { table: doc.table, tiles, tints: workerTints } });
  } catch (e) {
    // Flat colours are the fallback; nothing else depends on the atlas.
    console.warn('atlas unavailable, drawing flat colours', e);
  }
}

// Entity models, stand-ins, labels and animation live in entities.js.
const ents = createEntities(scene);

let status = 'connecting...';
// Read by the overlay script, which must keep working if this module cannot load.
Object.defineProperty(window, '__camStatus', { get: () => status });
let wsConn = null;
// The server replays the unit's surroundings out to a small radius, then
// whatever the viewer asks for: ] widens it, nearest chunks first.
const query = new URLSearchParams(location.search);
const MODES = ['first', 'third', 'orbit', 'top'];
const MODE_RADIUS = { first: 4, third: 4, orbit: 6, top: 6 };
let mode = MODES.includes(query.get('mode')) ? query.get('mode') : 'first';
const explicitRadius = Number(query.get('r')) || 0;
let radius = explicitRadius || MODE_RADIUS[mode];
setFog(radius);
const mini = document.getElementById('mini');
if (document.documentElement.classList.contains('nohud')) {
  // Without the debug text a refused viewer would just see a frozen frame.
  setInterval(() => { mini.textContent = status; mini.classList.toggle('show', status !== 'live'); }, 250);
}

// A mode switch keeps the socket; the stream only needs a different radius.
function setMode(m) {
  mode = m;
  if (explicitRadius) return;
  radius = MODE_RADIUS[m];
  setFog(radius);
  if (wsConn && wsConn.readyState === 1) wsConn.send(new Uint8Array([1, radius]));
}
addEventListener('message', ev => {
  const d = ev.data;
  if (ev.origin !== location.origin || !d || d.type !== 'crew-camera' || !MODES.includes(d.mode)) return;
  setMode(d.mode);
});

// Orbit: drag turns around the unit, the wheel moves in and out.
let azimuth = 0, elevation = 30, orbitDist = 8, dragging = false;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; renderer.domElement.setPointerCapture(e.pointerId); });
// A cancelled pointer (touch scroll takeover, lost capture) never sends
// pointerup, which would leave the drag stuck on.
for (const t of ['pointerup', 'pointercancel']) addEventListener(t, () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging || mode !== 'orbit') return;
  azimuth -= e.movementX * 0.4;
  elevation = clamp(elevation + e.movementY * 0.4, 5, 85);
});
renderer.domElement.addEventListener('wheel', e => {
  if (mode !== 'orbit') return;
  e.preventDefault();
  orbitDist = clamp(orbitDist * Math.exp(e.deltaY * 0.001), 3, 24);
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key !== ']' || !wsConn || wsConn.readyState !== 1) return;
  radius = Math.min(radius + 2, 32);
  setFog(radius);
  wsConn.send(new Uint8Array([1, radius]));
});
function connect() {
  // Relative to the page so it works behind a path prefix.
  const u = new URL('v1/camera/ws', location.href);
  u.protocol = u.protocol === 'https:' ? 'wss:' : 'ws:';
  u.search = location.search;
  const ws = wsConn = new WebSocket(u);
  ws.binaryType = 'arraybuffer';
  let opened = false;
  ws.onopen = () => {
    opened = true; status = 'live'; stats.wsOpenMs = performance.now() - t0;
    // The server starts every viewer at its own default radius.
    if (!explicitRadius) ws.send(new Uint8Array([1, radius]));
  };
  // A viewer is dropped when it falls behind or the unit's session ends; a
  // reconnect replays the world, so retrying is always safe.
  ws.onclose = () => {
    // Kept until the next open so a refused tile does not flicker back to
    // "retrying" on every probe cycle.
    if (status !== 'viewer limit reached') status = 'disconnected, retrying';
    setTimeout(connect, 2000);
    // A refused handshake gives the page no status; the plain GET reaches the
    // same viewer-cap check and answers 503.
    if (!opened) {
      const h = new URL(u); h.protocol = location.protocol;
      fetch(h, { cache: 'no-store' }).then(r => { if (r.status === 503 && wsConn === ws) status = 'viewer limit reached'; }, () => {});
    }
  };
  ws.onmessage = onMessage;
}
// Wire format 3: every message is binary, type byte first, little-endian.
// The layout is documented beside the encoder in wire.go.
let entTypes = [];
function onMessage(ev) {
  const buf = ev.data;
  stats.bytes += buf.byteLength;
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let p = 1;
  const uvarint = () => { let v = 0, shift = 1; for (;;) { const b = u8[p++]; v += (b & 127) * shift; if (b < 128) return v; shift *= 128; } };
  const f32 = () => { const v = dv.getFloat32(p, true); p += 4; return v; };
  const text = n => { const s = new TextDecoder().decode(u8.subarray(p, p + n)); p += n; return s; };
  const angle = a => { const d = a * 360 / 256; return d > 180 ? d - 360 : d; };
  switch (u8[0]) {
    case 1:
      if (u8[1] !== 3) { status = 'unsupported wire version ' + u8[1]; wsConn.close(); }
      break;
    case 2: {
      const n = dv.getUint16(p, true); p += 2;
      mats = [];
      for (let i = 0; i < n; i++) {
        const id = u8[p], alpha = u8[p + 1] / 255, r = u8[p + 2], g = u8[p + 3], b = u8[p + 4], flags = u8[p + 5], len = u8[p + 6];
        p += 7;
        mats[id - 1] = { name: text(len), alpha, nonCube: (flags & 1) !== 0, rgb: linear('#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('')) };
      }
      post({ t: 'mats', mats });
      break;
    }
    case 3: {
      const cx = dv.getInt32(1, true), cy = dv.getInt32(5, true), cz = dv.getInt32(9, true);
      const n = dv.getUint16(13, true), pal = u8.subarray(15, 15 + n);
      const w = n <= 1 ? 0 : 32 - Math.clz32(n - 1);
      const cells = new Uint8Array(4096);
      if (w === 0) cells.fill(pal[0]);
      else {
        let at = 15 + n, acc = 0, have = 0;
        const mask = (1 << w) - 1;
        for (let i = 0; i < 4096; i++) {
          while (have < w) { acc |= u8[at++] << have; have += 8; }
          cells[i] = pal[acc & mask]; acc >>>= w; have -= w;
        }
      }
      const key = cx + ',' + cy + ',' + cz;
      blocks.set(key, cells);
      stats.lastBlockAt = performance.now();
      post({ t: 'set', key, cells });
      break;
    }
    case 4: {
      const x = dv.getInt32(1, true), y = dv.getInt32(5, true), z = dv.getInt32(9, true);
      const key = (x >> 4) + ',' + (y >> 4) + ',' + (z >> 4);
      const b = blocks.get(key);
      if (b) { b[((((y & 15) << 4) | (z & 15)) << 4) | (x & 15)] = u8[13]; post({ t: 'edit', key, i: ((((y & 15) << 4) | (z & 15)) << 4) | (x & 15), v: u8[13] }); }
      break;
    }
    case 5: {
      const flags = u8[p++];
      if (flags & 1) { me.x = f32(); me.y = f32(); me.z = f32(); me.yaw = f32(); me.pitch = f32(); }
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), type = entTypes[dv.getUint16(p, true)] ?? '?';
        p += 2;
        const x = f32(), y = f32(), z = f32();
        ents.update({ id, type, x, y, z, yaw: angle(u8[p]), pitch: angle(u8[p + 1]), head: angle(u8[p + 2]) });
        p += 3;
      }
      break;
    }
    case 6:
      for (let n = uvarint(); n > 0; n--) {
        ents.remove(uvarint());
      }
      break;
    case 7:
      blocks.clear(); ready.length = 0; queued = 0; post({ t: 'clear', epoch: ++epoch }); for (const ms of meshes.values()) for (const o of ms) { scene.remove(o); o.geometry.dispose(); }
      meshes.clear(); ents.clear();
      break;
    case 8: {
      const n = dv.getUint16(p, true); p += 2;
      entTypes = [];
      for (let i = 0; i < n; i++) { const len = u8[p++]; entTypes.push(text(len)); }
      break;
    }
    case 9:
      loadAtlas();
      break;
    case 10:
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), len = u8[p++];
        ents.setName(id, text(len));
      }
      break;
    case 11:
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), flags = u8[p], color = u8[p + 1], len = u8[p + 2];
        p += 3;
        ents.setLook(id, flags, color, text(len));
      }
      break;
    case 12:
      // Only the table format this page understands; a newer one is left alone.
      if (u8[1] === 1) ents.loadModels();
      break;
    case 13: {
      // Wire id 0 is the unit's own body, which the page keeps as -1.
      const id = uvarint(), slim = (u8[p++] & 1) !== 0, len = uvarint();
      if (len > 0 && p + len <= u8.length) ents.setSkin(id || -1, slim, u8.slice(p, p + len));
      break;
    }
    case 14:
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), slots = [];
        for (let i = 0; i < 4; i++) { const len = u8[p++]; slots.push(text(len)); }
        ents.setArmour(id || -1, slots);
      }
      break;
  }
}
connect();

function placeCamera(m) {
  const yaw = me.yaw * Math.PI / 180, pitch = me.pitch * Math.PI / 180;
  const fx = -Math.sin(yaw), fz = Math.cos(yaw); // facing, flattened
  camera.up.set(0, 1, 0);
  if (m === 'first') {
    ents.remove(-1);
    camera.position.set(me.x, me.y, me.z);
    camera.lookAt(me.x + fx * Math.cos(pitch), me.y - Math.sin(pitch), me.z + fz * Math.cos(pitch));
    return;
  }
  // The eye is the unit's head, so the body hangs below it.
  ents.update({ id: -1, type: 'player', x: me.x, y: me.y - 1.62, z: me.z, yaw: me.yaw, pitch: me.pitch, head: me.yaw });
  if (m === 'third') {
    camera.position.set(me.x - fx * 4, me.y + 1.5, me.z - fz * 4);
  } else if (m === 'orbit') {
    const az = azimuth * Math.PI / 180, el = elevation * Math.PI / 180;
    camera.position.set(me.x + orbitDist * Math.cos(el) * Math.sin(az), me.y + orbitDist * Math.sin(el), me.z + orbitDist * Math.cos(el) * Math.cos(az));
  } else {
    camera.position.set(me.x, me.y + 40, me.z);
    // Looking straight down leaves roll free; facing as screen-up keeps the map oriented to the unit.
    camera.up.set(fx, 0, fz);
  }
  camera.lookAt(me.x, me.y, me.z);
}

let lastAt = 0;
function frame() {
  const workStart = performance.now();
  // Adopt finished meshes within a time budget so the view stays interactive.
  const until = performance.now() + 8;
  while (ready.length && performance.now() < until) adopt(ready.shift());
  if (performance.now() - lastAt > 200) { lastAt = performance.now(); worker.postMessage({ t: 'at', at: { x: me.x, y: me.y, z: me.z } }); }
  placeCamera(mode);
  skyDome.position.copy(camera.position);
  cull();
  ents.frame(performance.now());
  renderer.render(scene, camera);
  stats.frames++;
  // Time spent in this callback, not the gap between frames: the gap is pinned
  // to the display refresh and says nothing about how heavy a tile is.
  const work = performance.now() - workStart;
  stats.workMs += work;
  if (work > stats.workMaxMs) stats.workMaxMs = work;
  if (stats.settledMs === null && blocks.size > 0 && !meshing() && performance.now() - stats.lastBlockAt > 1000) stats.settledMs = stats.lastBlockAt - t0;
  if (stats.firstFrameMs === null && meshes.size > 0) stats.firstFrameMs = performance.now() - t0;
  hud.textContent = `crew camera  ${status}  mode ${mode}  radius ${radius} (] widens)\ntextures ${atlas ? 'on' : 'off'}  sub-chunks ${blocks.size}  meshes ${stats.drawn}/${stats.total} drawn  entities ${ents.count}\nyaw ${me.yaw.toFixed(0)} pitch ${me.pitch.toFixed(0)}\nfirst frame ${stats.firstFrameMs?.toFixed(0) ?? '-'} ms  settled ${stats.settledMs?.toFixed(0) ?? '-'} ms  rx ${(stats.bytes / 1024).toFixed(0)} KiB`;
  requestAnimationFrame(frame);
}
frame();
</script>
