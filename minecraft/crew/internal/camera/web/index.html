<!doctype html>
<meta charset="utf-8">
<title>crew camera</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px monospace; }
  canvas { display: block; }
  #debug { position: fixed; left: 8px; top: 8px; color: #fff; background: #0008; padding: 4px 8px; white-space: pre; }
  #debug.off { display: none; }

  /* Operator overlay: plain DOM over the canvas, fed by /v1/state. */
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 12px/1.3 monospace; text-shadow: 1px 1px 0 #000; }
  #ui .panel { position: absolute; background: #000a; border: 1px solid #fff3; padding: 6px 8px; }
  #ui h2 { margin: 0 0 4px; font-size: 11px; font-weight: normal; letter-spacing: .08em; text-transform: uppercase; color: #bbb; }
  #cross { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; mix-blend-mode: difference; }
  #cross::before, #cross::after { content: ""; position: absolute; background: #fff; }
  #cross::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #cross::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #bottom { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #hearts { display: flex; gap: 1px; height: 18px; }
  .heart { width: 18px; height: 18px; image-rendering: pixelated; background-size: 100% 100%; }
  .row { display: flex; gap: 2px; }
  .slot { position: relative; width: 36px; height: 36px; box-sizing: border-box; background: #0009; border: 2px solid #555; }
  .slot.sel { border-color: #fff; box-shadow: 0 0 0 2px #000; }
  .icon { position: absolute; inset: 2px; image-rendering: pixelated; background-repeat: no-repeat; font-size: 9px; overflow: hidden; word-break: break-all; }
  .count { position: absolute; right: 2px; bottom: 0; font-size: 12px; font-weight: bold; }
  #inv { right: 8px; top: 8px; }
  #inv .gap { height: 8px; }
  #status { right: 8px; bottom: 8px; min-width: 200px; }
  #status .dead { color: #f66; font-weight: bold; }
  #status .live { color: #7f7; }
  #status .bad { color: #fb5; }
  #tasks { left: 8px; bottom: 28px; width: 280px; }
  #tasks .cur { margin-bottom: 6px; }
  .bar { height: 8px; background: #333; border: 1px solid #888; margin: 3px 0; }
  .bar > div { height: 100%; background: #5c5; }
  .bar.pending > div { width: 30%; background: #aa5; }
  .t { display: flex; gap: 6px; }
  .t .st { width: 62px; flex: none; }
  .st.done { color: #7f7; } .st.failed { color: #f66; } .st.running { color: #8cf; } .st.queued { color: #bbb; } .st.cancelled { color: #fb5; }
  .reason { color: #f99; margin-left: 68px; }
  #hint { position: absolute; left: 8px; bottom: 8px; color: #ccc; font-size: 10px; }
  #ui.stale .panel, #ui.stale #bottom { opacity: .5; }
</style>
<div id="debug">connecting...</div>
<div id="ui">
  <div id="cross"></div>
  <div id="inv" class="panel"><h2>inventory</h2><div id="invgrid"></div></div>
  <div id="tasks" class="panel"><h2>tasks</h2><div id="tasklist">no state yet</div></div>
  <div id="status" class="panel"><h2>status</h2><div id="statuslist"></div></div>
  <div id="bottom"><div id="hearts"></div><div id="hotbar" class="row"></div></div>
  <div id="hint">F3: debug info</div>
</div>
<script>
// Operator overlay. A classic script, apart from the three.js module, so the
// readouts survive a failed CDN load. Server strings only ever reach the page
// through textContent.
(() => {
  const $ = id => document.getElementById(id);
  const ui = $('ui');
  const DIMENSIONS = { 0: 'overworld', 1: 'nether', 2: 'the end' };
  let sheet = null; // { doc, url }
  let last = null, failed = false;

  addEventListener('keydown', e => {
    if (e.key !== 'F3') return;
    e.preventDefault();
    $('debug').classList.toggle('off');
  });

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  // Pixel hearts as data URIs, drawn once.
  const HEART = ['.XX..XX.', 'XXXXXXXX', 'XXXXXXXX', 'XXXXXXXX', '.XXXXXX.', '..XXXX..', '...XX...'];
  function heartURL(fill) {
    let r = '';
    HEART.forEach((row, y) => [...row].forEach((c, x) => {
      if (c !== 'X') return;
      const edge = y === 0 || y === HEART.length - 1 || x === 0 || x === 7 || HEART[y][x - 1] === '.' || HEART[y][x + 1] === '.' || HEART[y - 1]?.[x] === '.' || HEART[y + 1]?.[x] === '.';
      const lit = fill === 'full' || (fill === 'half' && x < 4);
      const colour = edge ? '#2b0000' : lit ? (y < 2 && x % 4 === 1 ? '#ff9a9a' : '#e02020') : '#3a3a3a';
      r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colour}"/>`;
    }));
    return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 7" shape-rendering="crispEdges">${r}</svg>`)}")`;
  }
  const HEARTS = { full: heartURL('full'), half: heartURL('half'), empty: heartURL('empty') };

  function drawHearts(s) {
    const box = $('hearts');
    if (!s.health_known) { box.replaceChildren(); return; }
    const halves = Math.max(0, Math.min(20, Math.round(s.health)));
    const kids = [];
    for (let i = 0; i < 10; i++) {
      const h = el('div', 'heart');
      h.style.backgroundImage = HEARTS[halves >= 2 * i + 2 ? 'full' : halves === 2 * i + 1 ? 'half' : 'empty'];
      kids.push(h);
    }
    box.title = `${s.health} health`;
    box.replaceChildren(...kids);
  }

  // Item names arrive without the namespace.
  function icon(name) {
    const d = el('div', 'icon');
    if (!sheet) { d.textContent = name.slice(0, 6); return d; }
    const r = sheet.doc.items['minecraft:' + name] ?? sheet.doc.placeholder;
    const w = r[2] - r[0], h = r[3] - r[1], px = 28;
    d.style.backgroundImage = `url(${sheet.url})`;
    d.style.backgroundSize = `${px / w}px ${px / h}px`;
    d.style.backgroundPosition = `${-r[0] / w * px}px ${-r[1] / h * px}px`;
    return d;
  }

  function slotEl(item, selected) {
    const d = el('div', 'slot' + (selected ? ' sel' : ''));
    if (item) {
      d.title = item.name.replace(/_/g, ' ');
      d.append(icon(item.name));
      if (item.count > 1) d.append(el('span', 'count', String(item.count)));
    }
    return d;
  }

  function drawInventory(s) {
    const bySlot = new Map((s.inventory ?? []).map(i => [i.slot, i]));
    const row = (from) => { const r = el('div', 'row'); for (let i = from; i < from + 9; i++) r.append(slotEl(bySlot.get(i), false)); return r; };
    const grid = [];
    for (let r = 1; r < 4; r++) grid.push(row(r * 9));
    grid.push(el('div', 'gap'), row(0));
    $('invgrid').replaceChildren(...grid);

    const hot = [];
    for (let i = 0; i < 9; i++) hot.push(slotEl(bySlot.get(i), s.held_known && s.held_slot === i));
    $('hotbar').replaceChildren(...hot);
  }

  function field(label, value, cls) {
    const d = el('div');
    d.append(el('span', '', label + ' '), el('span', cls || '', value));
    return d;
  }

  function drawStatus(s) {
    const cam = window.__camStatus ?? 'page script not running';
    const rows = [field('camera', cam, cam === 'live' ? 'live' : 'bad')];
    if (failed) rows.push(field('crew', 'status unreachable', 'bad'));
    else if (!s.spawned) rows.push(field('crew', 'not in the world', 'bad'));
    else rows.push(s.dead ? field('crew', 'dead', 'dead') : field('crew', 'alive', 'live'));
    if (s.spawned) {
      rows.push(field('dimension', DIMENSIONS[s.dimension] ?? `unknown (${s.dimension})`));
      rows.push(field('position', s.position_known ? s.position.map(v => Math.round(v)).join(', ') : 'unknown'));
    }
    $('statuslist').replaceChildren(...rows);
  }

  function taskLine(t) {
    const d = el('div');
    const line = el('div', 't');
    line.append(el('span', 'st ' + t.state, t.state), el('span', '', `${t.template}${t.item ? ' ' + t.item.replace(/^minecraft:/, '') : ''}`));
    d.append(line);
    if (t.reason) d.append(el('div', 'reason', t.reason));
    return d;
  }

  function drawTasks(tasks) {
    const out = [];
    const cur = tasks?.current;
    if (cur) {
      const c = el('div', 'cur');
      c.append(el('div', '', `${cur.template}${cur.item ? ': ' + cur.item.replace(/^minecraft:/, '') : ''}`));
      c.append(el('div', '', `skill ${cur.skill || '-'}  state ${cur.state}`));
      const bar = el('div', cur.qty > 0 ? 'bar' : 'bar pending'), fill = el('div');
      if (cur.qty > 0) fill.style.width = Math.min(100, cur.progress / cur.qty * 100) + '%';
      bar.append(fill);
      c.append(bar, el('div', '', cur.qty > 0 ? `${cur.progress} / ${cur.qty}` : `progress ${cur.progress}`));
      out.push(c);
    } else {
      out.push(el('div', 'cur', 'idle'));
    }
    const recent = tasks?.recent ?? [];
    if (recent.length) out.push(el('h2', '', 'recent'), ...recent.map(taskLine));
    $('tasklist').replaceChildren(...out);
  }

  function render() {
    const s = last?.state ?? { spawned: false, inventory: [] };
    ui.classList.toggle('stale', failed);
    drawHearts(s);
    drawInventory(s);
    drawStatus(s);
    drawTasks(last?.tasks);
  }

  // 404 until the server has built the sheet; retried on every poll.
  async function loadSheet() {
    if (sheet) return;
    try {
      const doc = await fetch('/v1/camera/items.json').then(r => { if (!r.ok) throw 0; return r.json(); });
      const url = '/v1/camera/items.png';
      await new Promise((ok, no) => { const i = new Image(); i.onload = ok; i.onerror = no; i.src = url; });
      sheet = { doc, url };
    } catch { /* icons stay as text until it exists */ }
  }

  async function poll() {
    try {
      const r = await fetch('/v1/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(String(r.status));
      last = await r.json();
      failed = false;
    } catch { failed = true; }
    if (!sheet) await loadSheet();
    render();
  }
  render();
  poll();
  setInterval(poll, 1000);
})();
</script>
<script type="importmap">{
  "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.min.js" },
  "integrity": { "https://unpkg.com/three@0.170.0/build/three.module.min.js": "sha384-IDC7sAMAIMB/TZ6dgKKPPAKZ2bXXXP8+FBMBC8cU319eBhKITx+PaalhfDkDNH28" }

<script type="module">
// Per-sub-chunk geometry with only the faces next to a non-opaque neighbour,
// the same technique prismarine-viewer's mesher uses; no code is copied.
import * as THREE from 'three';

const t0 = performance.now();
const stats = window.__stats = { firstFrameMs: null, frames: 0, bytes: 0, wsOpenMs: null, settledMs: null, lastBlockAt: 0, workMs: 0, workMaxMs: 0, drawn: 0, total: 0, drawnSum: 0, totalSum: 0 };
const hud = document.getElementById('debug');

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const sky = new THREE.Color(0x9ec5f0);
scene.background = sky;
const FOG_FAR = 120;
scene.fog = new THREE.Fog(sky, 40, FOG_FAR);
const camera = new THREE.PerspectiveCamera(80, innerWidth / innerHeight, 0.05, 300);
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

let mats = [];            // index = id
const blocks = new Map(); // "cx,cy,cz" -> Uint8Array(4096)
const meshes = new Map(); // key -> [opaque, translucent]
const entMeshes = new Map();
const me = { x: 0, y: 70, z: 0, yaw: 0, pitch: 0 };
window.__dbg = { entMeshes, scene, camera, me, blocks, meshes, get mats() { return mats; }, atlasReady: () => !!atlas };

// Meshing runs in a worker (mesher.js); the page keeps the cells only to
// apply block edits and report its size.
const worker = new Worker('/v1/camera/mesher.js');
let sent = 0, acked = 0, queued = 0, epoch = 0;
const ready = []; // finished meshes waiting for the next frame to adopt them
worker.onmessage = ev => {
  const m = ev.data;
  if (m.epoch !== epoch) return; // from before a reset
  if (m.t === 'mesh') ready.push(m);
  else { acked = m.seq; queued = m.queued; }
};
const post = (m, transfer) => worker.postMessage({ ...m, seq: ++sent }, transfer || []);
const meshing = () => ready.length > 0 || queued > 0 || acked !== sent;

// Same colour-space conversion the old in-page mesher got from THREE.Color.
const linear = css => { const c = new THREE.Color(css); return [c.r, c.g, c.b]; };

function adopt(m) {
  const old = meshes.get(m.key);
  if (old) { for (const o of old) { scene.remove(o); o.geometry.dispose(); } meshes.delete(m.key); }
  if (!blocks.has(m.key)) return;
  const out = [];
  for (const q of m.parts) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(q.p, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(q.c, 3));
    if (q.k < 2) geo.setAttribute('uv', new THREE.BufferAttribute(q.u, 2));
    geo.setIndex(new THREE.BufferAttribute(q.i, 1));
    const o = new THREE.Mesh(geo, blockMaterial(q.k));
    // Culled by hand against the tight box the worker measured; the built-in
    // test would compute a loose bounding sphere on the main thread instead.
    o.frustumCulled = false;
    o.matrixAutoUpdate = false;
    o.userData.box = new THREE.Box3(new THREE.Vector3(q.box[0], q.box[1], q.box[2]), new THREE.Vector3(q.box[3], q.box[4], q.box[5]));
    scene.add(o); out.push(o);
  }
  meshes.set(m.key, out);
}

const frustum = new THREE.Frustum(), projView = new THREE.Matrix4();
const fwd = new THREE.Vector3(), mid = new THREE.Vector3(), half = new THREE.Vector3();
// Past the fog's far plane everything is the sky colour, so those meshes
// cost fill and vertex work for nothing. Fog grows with depth along the view
// direction, not distance: off-axis terrain past FOG_FAR by distance can sit
// well inside it by depth and still show.
function nearestDepth(box) {
  box.getCenter(mid).sub(camera.position);
  box.getSize(half).multiplyScalar(.5);
  return mid.dot(fwd) - (Math.abs(fwd.x) * half.x + Math.abs(fwd.y) * half.y + Math.abs(fwd.z) * half.z);
}
function cull() {
  camera.updateMatrixWorld();
  projView.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projView);
  camera.getWorldDirection(fwd);
  let drawn = 0, total = 0;
  for (const ms of meshes.values()) for (const o of ms) {
    const box = o.userData.box;
    o.visible = frustum.intersectsBox(box) && nearestDepth(box) < FOG_FAR;
    total++; if (o.visible) drawn++;
  }
  stats.drawn = drawn; stats.total = total;
  stats.drawnSum += drawn; stats.totalSum += total;
}

let atlas = null; // { table, tints, tex }; the worker holds its own copy of the table

const flatMaterials = [null, null, new THREE.MeshBasicMaterial({ vertexColors: true }),
  new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: .6 })];
let texturedMaterials = null;
function blockMaterial(k) { return k < 2 ? texturedMaterials[k] : flatMaterials[k]; }

async function loadAtlas() {
  if (atlas) return;
  try {
    const [doc, img] = await Promise.all([
      fetch('/v1/camera/atlas.json').then(r => { if (!r.ok) throw new Error('atlas.json ' + r.status); return r.json(); }),
      new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('atlas.png')); i.src = '/v1/camera/atlas.png'; }),
    ]);
    const tex = new THREE.Texture(img);
    tex.magFilter = tex.minFilter = THREE.NearestFilter;
    tex.generateMipmaps = false; tex.flipY = false; tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    const tints = {}, workerTints = {};
    for (const [k, v] of Object.entries(doc.tints)) { tints[k] = new THREE.Color(v); workerTints[k] = [tints[k].r, tints[k].g, tints[k].b]; }
    texturedMaterials = [
      new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, alphaTest: .5 }),
      new THREE.MeshBasicMaterial({ map: tex, vertexColors: true, transparent: true, opacity: .6 }),
    ];
    atlas = { table: doc.table, tints, tex };
    post({ t: 'atlas', atlas: { table: doc.table, tints: workerTints } });
  } catch (e) {
    // Flat colours are the fallback; nothing else depends on the atlas.
    console.warn('atlas unavailable, drawing flat colours', e);
  }
}

// Entity stand-ins: sizes are the Bedrock hit boxes (width, height in
// blocks), colours are rough impressions. kind picks the silhouette:
// biped is an upright body with a head on top, quad a long body with its head
// at the front, blob a single box. These are invented simple shapes, not the
// game's models. Unknown types draw as a hashed-colour biped.
const ENTITY_TYPES = {
  player: { w: .6, h: 1.8, color: 0x2f6fd8, head: 0xe0b48a, kind: 'biped' },
  zombie: { w: .6, h: 1.95, color: 0x3a6f9a, head: 0x5a9a4a, kind: 'biped' },
  husk: { w: .6, h: 1.95, color: 0x8a7a55, head: 0xa89870, kind: 'biped' },
  drowned: { w: .6, h: 1.95, color: 0x3a8a8a, head: 0x5ab0a0, kind: 'biped' },
  skeleton: { w: .6, h: 1.99, color: 0xcfcfc6, head: 0xe6e6dc, kind: 'biped' },
  creeper: { w: .6, h: 1.7, color: 0x4bb23c, head: 0x5fcf4a, kind: 'biped', head_h: .5 },
  enderman: { w: .6, h: 2.9, color: 0x1c1226, head: 0x2a1a38, kind: 'biped', head_h: .5 },
  villager: { w: .6, h: 1.95, color: 0x7a5a3a, head: 0xd8a888, kind: 'biped' },
  witch: { w: .6, h: 1.95, color: 0x5a2a7a, head: 0xd8a888, kind: 'biped' },
  iron_golem: { w: 1.4, h: 2.7, color: 0xb8b8b0, head: 0xd0d0c8, kind: 'biped', head_h: .7 },
  armor_stand: { w: .5, h: 1.975, color: 0xa8865a, head: 0xc8a878, kind: 'biped', head_h: .35 },
  cow: { w: .9, h: 1.4, color: 0x4a3226, head: 0x5a4030, kind: 'quad', len: 1.3 },
  pig: { w: .9, h: .9, color: 0xe89a9a, head: 0xf0b0b0, kind: 'quad', len: 1.1 },
  sheep: { w: .9, h: 1.3, color: 0xe8e8e0, head: 0xc8b8a0, kind: 'quad', len: 1.2 },
  horse: { w: 1.4, h: 1.6, color: 0x8a5a30, head: 0x9a6a3a, kind: 'quad', len: 1.6 },
  wolf: { w: .6, h: .85, color: 0xbcbcb8, head: 0xd0d0cc, kind: 'quad', len: .9 },
  cat: { w: .6, h: .7, color: 0xc89a5a, head: 0xd8aa6a, kind: 'quad', len: .8 },
  chicken: { w: .4, h: .7, color: 0xf2f2f2, head: 0xe8d8a0, kind: 'biped', head_h: .25 },
  rabbit: { w: .4, h: .5, color: 0x9a7a5a, head: 0xb0906a, kind: 'quad', len: .5 },
  spider: { w: 1.4, h: .9, color: 0x3a2f2f, head: 0x4a3a3a, kind: 'quad', len: 1.2 },
  slime: { w: .52, h: .52, color: 0x6fd05a, kind: 'blob' },
  bat: { w: .5, h: .9, color: 0x4a3a2a, kind: 'blob' },
  bee: { w: .55, h: .5, color: 0xe8c030, kind: 'blob' },
  item: { w: .25, h: .25, color: 0xd8d8e8, kind: 'blob' },
  xp_orb: { w: .25, h: .25, color: 0x9ae83a, kind: 'blob' },
  arrow: { w: .2, h: .2, color: 0x8a6a40, kind: 'blob' },
};
const DEFAULT_ENTITY = { w: .6, h: 1.8, kind: 'biped' };

function entityDef(type) {
  const name = type.replace(/^minecraft:/, '');
  const d = ENTITY_TYPES[name];
  if (d) return d;
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const color = new THREE.Color().setHSL((h % 360) / 360, .6, .5).getHex();
  return { ...DEFAULT_ENTITY, color, head: new THREE.Color(color).offsetHSL(0, 0, .12).getHex() };
}

const entLights = [new THREE.AmbientLight(0xffffff, 1.6), new THREE.DirectionalLight(0xffffff, 1.4)];
entLights[1].position.set(.4, 1, .6);
for (const l of entLights) scene.add(l);
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const noseMat = new THREE.MeshLambertMaterial({ color: 0x20140c });
function part(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(boxGeo, mat);
  m.scale.set(w, h, d); m.position.set(x, y, z);
  return m;
}

// Feet-origin group facing +z, so the body yaw is the group's own rotation.
// `head` is a pivot at the neck that the head yaw and pitch turn.
function buildEntity(type) {
  const def = entityDef(type), g = new THREE.Group();
  const body = new THREE.MeshLambertMaterial({ color: def.color });
  const headMat = new THREE.MeshLambertMaterial({ color: def.head ?? def.color });
  const head = new THREE.Group();
  head.rotation.order = 'YXZ';
  if (def.kind === 'biped') {
    const hs = def.head_h ?? Math.min(.5, def.h * .26), bh = def.h - hs;
    g.add(part(def.w, bh, def.w * .6, body, 0, bh / 2, 0));
    head.position.set(0, bh, 0);
    head.add(part(hs, hs, hs, headMat, 0, hs / 2, 0), part(hs * .3, hs * .25, hs * .25, noseMat, 0, hs * .45, hs / 2));
  } else if (def.kind === 'quad') {
    const len = def.len ?? def.w * 1.2, hs = def.h * .36;
    g.add(part(def.w * .7, def.h * .45, len, body, 0, def.h * .55, 0), part(def.w * .45, def.h * .3, len * .6, body, 0, def.h * .15, 0));
    head.position.set(0, def.h * .75, len / 2);
    head.add(part(hs, hs, hs, headMat, 0, 0, hs * .4), part(hs * .3, hs * .25, hs * .25, noseMat, 0, -hs * .1, hs * .9));
  } else {
    g.add(part(def.w, def.h, def.w, body, 0, def.h / 2, 0), part(def.w * .3, def.h * .25, def.w * .25, noseMat, 0, def.h * .6, def.w / 2));
  }
  g.add(head);
  g.userData = { def, head };
  return g;
}

function makeLabel(text) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = 'bold 28px monospace';
  c.width = Math.ceil(ctx.measureText(text).width) + 20; c.height = 40;
  ctx.font = 'bold 28px monospace'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = '#fff'; ctx.fillText(text, 10, c.height / 2 + 1);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, fog: false, depthWrite: false }));
  s.scale.set(.3 * c.width / c.height, .3, 1);
  return s;
}

function disposeEntity(o) {
  scene.remove(o);
  o.traverse(n => {
    if (n.isMesh) n.material.dispose();
    if (n.isSprite) { n.material.map.dispose(); n.material.dispose(); }
  });
}

const names = new Map(); // entity id -> player name
function setLabel(id) {
  const m = entMeshes.get(id), name = names.get(id);
  if (!m || m.userData.labelled === name) return;
  if (m.userData.label) { m.remove(m.userData.label); m.userData.label.material.map.dispose(); m.userData.label.material.dispose(); m.userData.label = null; }
  m.userData.labelled = name;
  if (!name) return;
  const l = makeLabel(name);
  l.position.set(0, m.userData.def.h + .4, 0);
  m.add(l); m.userData.label = l;
}

const wrap = d => ((d + 540) % 360) - 180;
function entity(e) {
  let m = entMeshes.get(e.id);
  if (!m) {
    m = buildEntity(e.type);
    scene.add(m); entMeshes.set(e.id, m);
  }
  setLabel(e.id);
  // The wire carries the feet, so the model needs no per-type offset.
  m.position.set(e.x, e.y, e.z);
  m.rotation.y = -e.yaw * Math.PI / 180;
  const head = m.userData.head;
  head.rotation.y = -wrap(e.head - e.yaw) * Math.PI / 180;
  head.rotation.x = e.pitch * Math.PI / 180;
}

let status = 'connecting...';
// Read by the overlay script, which must keep working if this module cannot load.
Object.defineProperty(window, '__camStatus', { get: () => status });
let wsConn = null;
// The server replays the unit's surroundings out to a small radius, then
// whatever the viewer asks for: ] widens it, nearest chunks first.
let radius = Number(new URLSearchParams(location.search).get('r')) || 4;
addEventListener('keydown', e => {
  if (e.key !== ']' || !wsConn || wsConn.readyState !== 1) return;
  radius = Math.min(radius + 2, 32);
  wsConn.send(new Uint8Array([1, radius]));
});
function connect() {
  const ws = wsConn = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/v1/camera/ws' + location.search);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { status = 'live'; stats.wsOpenMs = performance.now() - t0; };
  // A viewer is dropped when it falls behind or the unit's session ends; a
  // reconnect replays the world, so retrying is always safe.
  ws.onclose = () => { status = 'disconnected, retrying'; setTimeout(connect, 2000); };
  ws.onmessage = onMessage;
}
// Wire format 3: every message is binary, type byte first, little-endian.
// The layout is documented beside the encoder in wire.go.
let entTypes = [];
function onMessage(ev) {
  const buf = ev.data;
  stats.bytes += buf.byteLength;
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let p = 1;
  const uvarint = () => { let v = 0, shift = 1; for (;;) { const b = u8[p++]; v += (b & 127) * shift; if (b < 128) return v; shift *= 128; } };
  const f32 = () => { const v = dv.getFloat32(p, true); p += 4; return v; };
  const text = n => { const s = new TextDecoder().decode(u8.subarray(p, p + n)); p += n; return s; };
  const angle = a => { const d = a * 360 / 256; return d > 180 ? d - 360 : d; };
  switch (u8[0]) {
    case 1:
      if (u8[1] !== 3) { status = 'unsupported wire version ' + u8[1]; wsConn.close(); }
      break;
    case 2: {
      const n = dv.getUint16(p, true); p += 2;
      mats = [];
      for (let i = 0; i < n; i++) {
        const id = u8[p], alpha = u8[p + 1] / 255, r = u8[p + 2], g = u8[p + 3], b = u8[p + 4], flags = u8[p + 5], len = u8[p + 6];
        p += 7;
        mats[id - 1] = { name: text(len), alpha, nonCube: (flags & 1) !== 0, rgb: linear('#' + [r, g, b].map(c => c.toString(16).padStart(2, '0')).join('')) };
      }
      post({ t: 'mats', mats });
      break;
    }
    case 3: {
      const cx = dv.getInt32(1, true), cy = dv.getInt32(5, true), cz = dv.getInt32(9, true);
      const n = dv.getUint16(13, true), pal = u8.subarray(15, 15 + n);
      const w = n <= 1 ? 0 : 32 - Math.clz32(n - 1);
      const cells = new Uint8Array(4096);
      if (w === 0) cells.fill(pal[0]);
      else {
        let at = 15 + n, acc = 0, have = 0;
        const mask = (1 << w) - 1;
        for (let i = 0; i < 4096; i++) {
          while (have < w) { acc |= u8[at++] << have; have += 8; }
          cells[i] = pal[acc & mask]; acc >>>= w; have -= w;
        }
      }
      const key = cx + ',' + cy + ',' + cz;
      blocks.set(key, cells);
      stats.lastBlockAt = performance.now();
      post({ t: 'set', key, cells });
      break;
    }
    case 4: {
      const x = dv.getInt32(1, true), y = dv.getInt32(5, true), z = dv.getInt32(9, true);
      const key = (x >> 4) + ',' + (y >> 4) + ',' + (z >> 4);
      const b = blocks.get(key);
      if (b) { b[((((y & 15) << 4) | (z & 15)) << 4) | (x & 15)] = u8[13]; post({ t: 'edit', key, i: ((((y & 15) << 4) | (z & 15)) << 4) | (x & 15), v: u8[13] }); }
      break;
    }
    case 5: {
      const flags = u8[p++];
      if (flags & 1) { me.x = f32(); me.y = f32(); me.z = f32(); me.yaw = f32(); me.pitch = f32(); }
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), type = entTypes[dv.getUint16(p, true)] ?? '?';
        p += 2;
        const x = f32(), y = f32(), z = f32();
        entity({ id, type, x, y, z, yaw: angle(u8[p]), pitch: angle(u8[p + 1]), head: angle(u8[p + 2]) });
        p += 3;
      }
      break;
    }
    case 6:
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), o = entMeshes.get(id);
        names.delete(id);
        if (o) { disposeEntity(o); entMeshes.delete(id); }
      }
      break;
    case 7:
      blocks.clear(); ready.length = 0; queued = 0; post({ t: 'clear', epoch: ++epoch }); for (const ms of meshes.values()) for (const o of ms) { scene.remove(o); o.geometry.dispose(); }
      meshes.clear(); for (const o of entMeshes.values()) disposeEntity(o); entMeshes.clear(); names.clear();
      break;
    case 8: {
      const n = dv.getUint16(p, true); p += 2;
      entTypes = [];
      for (let i = 0; i < n; i++) { const len = u8[p++]; entTypes.push(text(len)); }
      break;
    }
    case 9:
      loadAtlas();
      break;
    case 10:
      for (let n = uvarint(); n > 0; n--) {
        const id = uvarint(), len = u8[p++];
        names.set(id, text(len));
        setLabel(id);
      }
      break;
  }
}
connect();

let lastAt = 0;
function frame() {
  const workStart = performance.now();
  // Adopt finished meshes within a time budget so the view stays interactive.
  const until = performance.now() + 8;
  while (ready.length && performance.now() < until) adopt(ready.shift());
  if (performance.now() - lastAt > 200) { lastAt = performance.now(); worker.postMessage({ t: 'at', at: { x: me.x, y: me.y, z: me.z } }); }
  camera.position.set(me.x, me.y, me.z);
  const yaw = me.yaw * Math.PI / 180, pitch = me.pitch * Math.PI / 180;
  camera.lookAt(me.x - Math.sin(yaw) * Math.cos(pitch), me.y - Math.sin(pitch), me.z + Math.cos(yaw) * Math.cos(pitch));
  cull();
  renderer.render(scene, camera);
  stats.frames++;
  // Time spent in this callback, not the gap between frames: the gap is pinned
  // to the display refresh and says nothing about how heavy a tile is.
  const work = performance.now() - workStart;
  stats.workMs += work;
  if (work > stats.workMaxMs) stats.workMaxMs = work;
  if (stats.settledMs === null && blocks.size > 0 && !meshing() && performance.now() - stats.lastBlockAt > 1000) stats.settledMs = stats.lastBlockAt - t0;
  if (stats.firstFrameMs === null && meshes.size > 0) stats.firstFrameMs = performance.now() - t0;
  hud.textContent = `crew camera  ${status}  radius ${radius} (] widens)\ntextures ${atlas ? 'on' : 'off'}  sub-chunks ${blocks.size}  meshes ${stats.drawn}/${stats.total} drawn  entities ${entMeshes.size}\nyaw ${me.yaw.toFixed(0)} pitch ${me.pitch.toFixed(0)}\nfirst frame ${stats.firstFrameMs?.toFixed(0) ?? '-'} ms  settled ${stats.settledMs?.toFixed(0) ?? '-'} ms  rx ${(stats.bytes / 1024).toFixed(0)} KiB`;
  requestAnimationFrame(frame);
}
frame();
</script>
