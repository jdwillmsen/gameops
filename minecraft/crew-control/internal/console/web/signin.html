<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Crew control</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/console.css">
</head>
<body class="signin">
<main id="card">
  <h1>Crew control</h1>
  <p id="who" role="status" hidden></p>
  <p id="intro">Sign in with your passkey to command the units. Without signing in the console is view-only.</p>
  <button id="login" type="button">Sign in with passkey</button>
  <details id="enrol">
    <summary>I have an invite</summary>
    <form id="invite-form" method="post" action="/signin" autocomplete="off">
      <label>Operator <input id="operator" name="operator" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label>Invite code <input id="invite" name="invite" type="password" autocomplete="one-time-code" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <button id="register" type="submit" disabled>Create passkey</button>
    </form>
  </details>
  <form id="login-xbox" action="/auth/xbox/start" method="get" hidden>
    <button type="submit">Sign in with Xbox</button>
  </form>
  <button id="signout" type="button" hidden>Sign out</button>
  <p id="msg" role="alert"></p>
  <p id="next"></p>
  <p><a href="/">Back to the console</a></p>
</main>
<script type="module" src="/static/signin.js"></script>
</body>
</html>
