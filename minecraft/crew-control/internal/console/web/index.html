<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew control</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/console.css">
<link rel="stylesheet" href="/static/charts/charts.css">
<link rel="stylesheet" href="/static/overview.css">
<link rel="stylesheet" href="/static/dash.css">
<link rel="stylesheet" href="/static/detail.css">
<link rel="stylesheet" href="/static/containers.css">
<link rel="stylesheet" href="/static/heat.css">
<link rel="stylesheet" href="/static/replay.css">
<link rel="stylesheet" href="/static/graph/graph.css">
<link rel="stylesheet" href="/static/alerts.css">
<link rel="stylesheet" href="/static/director.css">
<link rel="stylesheet" href="/static/explorer.css">
<link rel="stylesheet" href="/static/graph/ledger.css">
<link rel="stylesheet" href="/static/timeline.css">
<link rel="stylesheet" href="/static/insights.css">
</head>
<body>
<header id="bar">
  <nav id="units" aria-label="Units"></nav>
  <nav id="modes" aria-label="Camera mode"></nav>
  <button id="wall-toggle" type="button" title="Toggle wall (w)">Wall</button>
  <button id="fleet-toggle" type="button" title="Fleet overview (o)">Fleet</button>
  <button id="dash-toggle" type="button" title="Dashboard (b)">Dashboard</button>
  <button id="detail-toggle" type="button" title="Unit detail (d)">Detail</button>
  <button id="heat-toggle" type="button" title="Heatmap (h)">Heat</button>
  <button id="jobgraph-toggle" type="button" title="Job graph (g)">Graph</button>
  <button id="explorer-toggle" type="button" title="Event explorer (x)">Explorer</button>
  <button id="ledger-toggle" type="button" title="World ledger (l)">Ledger</button>
  <button id="timeline-toggle" type="button" title="Timeline (t)">Timeline</button>
  <button id="replay-toggle" type="button" title="Replay (y)">Replay</button>
  <button id="director-toggle" type="button" title="Auto-director: follow the most interesting unit (Shift-D)" aria-pressed="false">Director</button>
  <span class="tools">
    <button id="t-roster" type="button" title="Roster (r)">Roster</button>
    <button id="t-events" type="button" title="Event feed (e)">Events <span id="dock-unread" hidden></span></button>
    <button id="t-radar" type="button" title="Radar (m)" hidden>Radar</button>
    <button id="t-palette" type="button" title="Command palette (Ctrl-K)">Ctrl-K</button>
    <button id="t-help" type="button" title="Keyboard help (?)">?</button>
    <button id="jobs-toggle" type="button" title="Toggle jobs (Shift-J)" hidden>Jobs</button>
    <button id="alerts-toggle" type="button" title="Alerts (Shift-A)">Alerts <span id="alerts-unread" hidden></span></button>
    <button id="squad-toggle" type="button" title="Toggle squads (Shift-S)">Squads</button>
  </span>
  <span id="link" role="status"></span>
  <span id="session"></span>
</header>
<div id="content">
  <aside id="side" aria-label="Fleet">
    <div class="scroll"><table id="roster"></table></div>
    <button id="roster-sel" type="button" class="danger" hidden></button>
    <section id="radar-box" hidden>
      <h3>Radar</h3>
      <canvas id="radar" width="320" height="320"></canvas>
      <p id="radar-empty">no positions yet</p>
    </section>
  </aside>
  <div id="center">
    <main id="stage"></main>
    <div id="pip" hidden></div>
  </div>
  <aside id="panel" aria-label="Commands" hidden></aside>
  <aside id="jobs" aria-label="Jobs" hidden></aside>
  <aside id="squad" aria-label="Squads" hidden></aside>
  <aside id="alerts" aria-label="Alerts" hidden></aside>
</div>
<section id="dock" aria-label="Events">
  <div class="dockbar">
    <h3>Events</h3>
    <select id="feed-level" aria-label="Level"><option value="all">all</option><option value="warn">warnings and worse</option><option value="crit">critical</option></select>
    <label><input type="checkbox" id="feed-unit"> this unit</label>
  </div>
  <ul id="feed"></ul>
</section>
<footer id="statusbar">
  <span id="sb-fleet"></span>
  <span id="sb-alerts"></span>
  <span id="sb-unit"></span>
  <span id="sb-director"></span>
  <span id="sb-seen"></span>
  <span id="sb-clock"></span>
</footer>
<div id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/static/console.js"></script>
</body>
</html>
