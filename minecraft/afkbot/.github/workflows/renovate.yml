name: Renovate

# renovate.json existed since the repo's first commit, but nothing ever
# executed it — no GitHub App installation, no workflow. Dead config: not a
# single Renovate PR was ever opened, so a bedrock-protocol release would
# have sat unnoticed until a human bumped the lockfile by hand, and the
# protocol-check workflow tests against the lockfile.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      log_level:
        description: Renovate log level (debug to diagnose a failing run)
        required: false
        default: info

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Runs as RELEASE_PR_TOKEN, not the default GITHUB_TOKEN: PRs opened
      # with the default token are deliberately excluded from triggering other
      # workflows, so ci.yml's `pull_request` trigger would never fire on
      # Renovate's own PRs and their required checks could never run. The
      # protocol-check workflow already uses this same PAT for the same
      # reason, and its scope (Contents + Pull requests: write on this repo)
      # is exactly what Renovate needs — no second secret to rotate.
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RELEASE_PR_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
