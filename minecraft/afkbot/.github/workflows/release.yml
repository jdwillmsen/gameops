name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.2.0

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tag drives the image tag. A git tag of v0.1.0 publishes 0.1.0 —
      # never `latest`, because the chart pins a tag and a moving one would
      # reintroduce exactly the silent-upgrade hazard the server version pin
      # exists to prevent.
      - id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # linux/amd64 only: every node in the target cluster is amd64, and the
      # native RakNet addon is compiled from source, so an arm64 variant would
      # roughly double build time for an image nothing would pull.
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/minecraft-afk-bot:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/minecraft-afk-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
