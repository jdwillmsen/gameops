<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>World map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 id="world">World map</h1>
    <nav id="dimensions" class="tabs" aria-label="Dimension"></nav>
    <form id="search" class="search" role="search" autocomplete="off" hidden>
      <input id="search-box" name="q" type="search" maxlength="64" placeholder="Search the map" role="combobox"
        aria-label="Search biomes, structures, markers and your waypoints" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
      <div id="search-panel" class="search-panel" hidden>
        <ul id="search-results" role="listbox" aria-label="Search results"></ul>
        <p id="search-note" class="search-note" role="status"></p>
      </div>
    </form>
    <form id="goto" class="goto" autocomplete="off">
      <label>X <input id="goto-x" name="x" type="number" step="1" inputmode="numeric" required></label>
      <label>Z <input id="goto-z" name="z" type="number" step="1" inputmode="numeric" required></label>
      <button type="submit">Go</button>
    </form>
    <label class="toggle"><input id="grid" type="checkbox"> Grid</label>
    <div id="live-control" class="live-control" role="group" aria-label="Live updates" hidden>
      <button id="live-pause" type="button">Pause live</button>
      <label>every
        <select id="live-interval">
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="5">5 s</option>
          <option value="10">10 s</option>
          <option value="30">30 s</option>
        </select>
      </label>
    </div>
    <button id="copy" type="button">Copy link</button>
    <span id="who" class="who" hidden></span>
    <button id="logout" type="button" hidden>Log out</button>
  </header>
  <div class="stage">
    <aside id="layers" class="layers" aria-label="Layers" hidden>
      <button id="layers-toggle" type="button" aria-expanded="false" aria-controls="layers-body">Layers</button>
      <div id="layers-body" hidden></div>
    </aside>
    <main id="map" aria-label="Map"></main>
    <section id="inspect" class="inspect" aria-labelledby="inspect-name" hidden>
      <div class="inspect-head">
        <canvas id="inspect-picture" width="32" height="32" aria-hidden="true"></canvas>
        <div class="inspect-title">
          <h2 id="inspect-name"></h2>
          <span id="inspect-kind"></span>
        </div>
        <button id="inspect-close" type="button">Close</button>
      </div>
      <output id="inspect-coords" class="inspect-coords" aria-live="off"><span id="inspect-x" data-axis="X"></span> <span id="inspect-y" data-axis="Y"></span> <span id="inspect-z" data-axis="Z"></span></output>
      <p id="inspect-note" class="inspect-note" hidden><strong id="inspect-what" role="status"></strong> <span id="inspect-when"></span></p>
      <div class="inspect-actions">
        <button id="inspect-follow" type="button" aria-pressed="false">Follow</button>
        <button id="inspect-copy" type="button">Copy x y z</button>
      </div>
    </section>
    <p id="frozen" class="frozen" hidden><strong id="frozen-what" role="status"></strong> <span id="frozen-age"></span></p>
  </div>
  <section id="login" class="login" aria-labelledby="login-title" hidden>
    <div class="card">
      <h2 id="login-title">Log in from the game</h2>
      <p>This map is for players on the server. To show you are one:</p>
      <ol>
        <li>Join the server in Minecraft.</li>
        <li>Open chat and type <code id="login-command">!map</code></li>
        <li>Wait a moment. This page unlocks by itself.</li>
      </ol>
      <p id="login-note" class="note" role="status"></p>
      <button id="login-new" type="button" hidden>Get a new code</button>
    </div>
  </section>
  <footer class="bar foot">
    <output id="coords" aria-live="off">X —, Z —</output>
    <output id="biome" class="biome-at" aria-live="off" hidden></output>
    <output id="live" class="live" aria-live="off" hidden></output>
    <output id="refresh" class="refresh" role="timer" aria-live="off" hidden></output>
    <span id="status" role="status"></span>
  </footer>
  <script src="lib/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="layers.js"></script>
  <script src="live.js"></script>
  <script src="markers.js"></script>
  <script src="structures.js"></script>
  <script src="biomes.js"></script>
  <script src="search.js"></script>
</body>
</html>
