<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>World map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 id="world">World map</h1>
    <nav id="dimensions" class="tabs" aria-label="Dimension"></nav>
    <form id="goto" class="goto" autocomplete="off">
      <label>X <input id="goto-x" name="x" type="number" step="1" inputmode="numeric" required></label>
      <label>Z <input id="goto-z" name="z" type="number" step="1" inputmode="numeric" required></label>
      <button type="submit">Go</button>
    </form>
    <label class="toggle"><input id="grid" type="checkbox"> Grid</label>
    <nav id="live-filters" class="chips" aria-label="Live markers" hidden>
      <button type="button" data-live="on" aria-pressed="true">Live</button>
      <button type="button" data-live="players" aria-pressed="true"><i class="dot players"></i>Players <span class="count"></span></button>
      <button type="button" data-live="hostile" aria-pressed="true"><i class="dot hostile"></i>Hostile <span class="count"></span></button>
      <button type="button" data-live="passive" aria-pressed="true"><i class="dot passive"></i>Passive <span class="count"></span></button>
      <button type="button" data-live="villager" aria-pressed="true"><i class="dot villager"></i>Villagers <span class="count"></span></button>
      <button type="button" data-live="other" aria-pressed="true"><i class="dot other"></i>Other <span class="count"></span></button>
    </nav>
    <button id="copy" type="button">Copy link</button>
    <span id="who" class="who" hidden></span>
    <button id="logout" type="button" hidden>Log out</button>
  </header>
  <main id="map" aria-label="Map"></main>
  <section id="login" class="login" aria-labelledby="login-title" hidden>
    <div class="card">
      <h2 id="login-title">Log in from the game</h2>
      <p>This map is for players on the server. To show you are one:</p>
      <ol>
        <li>Join the server in Minecraft.</li>
        <li>Open chat and type <code id="login-command">!map</code></li>
        <li>Wait a moment. This page unlocks by itself.</li>
      </ol>
      <p id="login-note" class="note" role="status"></p>
      <button id="login-new" type="button" hidden>Get a new code</button>
    </div>
  </section>
  <footer class="bar foot">
    <output id="coords" aria-live="off">X —, Z —</output>
    <output id="live" class="live" aria-live="off" hidden></output>
    <span id="status" role="status"></span>
  </footer>
  <script src="lib/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
  <script src="live.js"></script>
</body>
</html>
